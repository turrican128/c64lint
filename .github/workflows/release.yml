name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-22.04   # oldest supported runner: oldest glibc, widest Linux reach
            target: linux
            binary: c64lint
            strip: "--strip"
          - os: windows-2022
            target: windows
            binary: c64lint.exe
            # --strip corrupts the bundled python DLL on Windows (txt2dirart
            # v0.9.0-rc2: builds, then exits 127 "Failed to load Python DLL").
            strip: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: install
        run: python -m pip install --quiet pyinstaller pytest pillow

      - name: tests must pass before anything is built
        run: python -m pytest tests/ -q

      - name: build single-file binary
        # Measured on Windows (2026-10-07): a plain build is 27 MB, because
        # PyInstaller drags in numpy (Pillow can use it, c64lint never does),
        # Pillow's AVIF/WebP/colour-management codecs and OpenSSL. Excluding
        # them gives 8.2 MB with byte-identical output on every example.
        #
        # Keep PIL.ImageFont: ImageDraw imports it at module level, and a
        # build without it compiles cleanly and dies on startup. Only its
        # FreeType engine (PIL._imagingft) is safe to drop. The smoke test
        # below is what catches the next module like that.
        run: >
          pyinstaller --onefile --name c64lint
          --console --noupx ${{ matrix.strip }}
          --exclude-module tkinter --exclude-module unittest
          --exclude-module pydoc --exclude-module doctest
          --exclude-module pdb --exclude-module sqlite3
          --exclude-module asyncio --exclude-module numpy
          --exclude-module PIL.ImageQt --exclude-module PIL.ImageTk
          --exclude-module PIL.ImageShow
          --exclude-module PIL._avif --exclude-module PIL.AvifImagePlugin
          --exclude-module PIL._webp --exclude-module PIL.WebPImagePlugin
          --exclude-module PIL._imagingcms --exclude-module PIL.ImageCms
          --exclude-module PIL._imagingft
          --exclude-module ssl --exclude-module _ssl
          --exclude-module hashlib --exclude-module _hashlib
          c64lint.py

      - name: the binary must actually run
        shell: bash
        run: |
          BIN="dist/${{ matrix.binary }}"
          "$BIN" --version
          "$BIN" palettes
          "$BIN" check examples/01-clean.png --mode mc --kla clean.kla
          [ "$(wc -c < clean.kla)" -eq 10003 ] || { echo "::error::bad kla size"; exit 1; }
          set +e
          "$BIN" check examples/02-bird-clash.png --mode mc \
                 --overlay ov.png --json r.json --fix fixed.png --kla fixed.kla
          [ $? -eq 1 ] || { echo "::error::broken example should exit 1"; exit 1; }
          "$BIN" check examples/05-hires-clash.png --mode hires --fix h.png
          [ $? -eq 1 ] || { echo "::error::hires example should exit 1"; exit 1; }
          "$BIN" check README.md --mode mc
          [ $? -eq 2 ] || { echo "::error::non-PNG should exit 2"; exit 1; }
          set -e
          # transparency and truncation go through other Pillow code paths
          python -c "from PIL import Image; i=Image.new('RGBA',(160,200)); i.save('alpha.png')"
          set +e
          "$BIN" check alpha.png --mode mc
          [ $? -eq 2 ] || { echo "::error::transparent PNG should exit 2"; exit 1; }
          set -e
          "$BIN" check fixed.png --mode mc
          "$BIN" check h.png --mode hires
          for f in ov.png r.json fixed.png fixed.diff.png fixed.kla; do
            [ -s "$f" ] || { echo "::error::missing output $f"; exit 1; }
          done
          echo "binary smoke test passed"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: c64lint-${{ matrix.target }}
          path: dist/${{ matrix.binary }}
          if-no-files-found: error

  linux-compat:
    name: linux binary on other distros
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: c64lint-linux
          path: bin

      - name: run it on older and different Linux systems
        # The build runs on ubuntu-22.04; a user may be on something older or
        # unrelated. glibc is the usual reason a PyInstaller binary refuses to
        # start, so try a spread of distributions in containers.
        run: |
          chmod +x bin/c64lint
          for image in debian:11 ubuntu:20.04 fedora:40; do
            echo "== $image"
            docker run --rm -v "$PWD:/w" -w /w "$image" sh -c '
              set -e
              ./bin/c64lint --version
              ./bin/c64lint check examples/01-clean.png --mode mc
              set +e
              ./bin/c64lint check examples/02-bird-clash.png --mode mc --fix /tmp/f.png --kla /tmp/f.kla
              [ $? -eq 1 ] || exit 1
              set -e
              ./bin/c64lint check /tmp/f.png --mode mc
              [ "$(wc -c < /tmp/f.kla)" -eq 10003 ]
            '
          done
          echo "linux binary ran on every image"

  package:
    name: package and publish
    needs: [build, linux-compat]
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # only this job publishes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: assemble the zips
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DIR="c64lint-${VERSION}"
          mkdir -p "$DIR/examples" "$DIR/docs"
          cp artifacts/c64lint-windows/c64lint.exe "$DIR/"
          cp artifacts/c64lint-linux/c64lint       "$DIR/"
          chmod +x "$DIR/c64lint"
          cp c64lint.py README.md CHANGELOG.md LICENSE "$DIR/"
          cp examples/* "$DIR/examples/"
          cp docs/*.png "$DIR/docs/"
          zip -r -q "${DIR}.zip" "$DIR"
          zip -r -q "c64lint-examples.zip" examples
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ZIP=${DIR}.zip"   >> "$GITHUB_ENV"
          unzip -l "${DIR}.zip"
          required="c64lint c64lint.exe c64lint.py README.md CHANGELOG.md LICENSE"
          required="$required examples/README.txt examples/01-clean.png examples/02-bird-clash.png"
          required="$required examples/05-hires-clash.png docs/overlay-example.png"
          listing=$(unzip -Z1 "${DIR}.zip")
          for f in $required; do
            echo "$listing" | grep -qxF "${DIR}/${f}" || { echo "::error::missing from the zip: $f"; exit 1; }
          done
          echo "zip contents verified"

      - name: publish the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: c64lint ${{ env.VERSION }}
          body_path: CHANGELOG.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            ${{ env.ZIP }}
            c64lint-examples.zip
